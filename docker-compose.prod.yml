services:
  postgres:
    image: postgres:16-alpine
    container_name: wawancara-db-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: wawancara_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: wawancara-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/wawancara_db
      BASE_URL: ${BASE_URL:-http://localhost}
      PORT: ${PORT:-3000}
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      HF_KEY: ${HF_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_HOST_URL: ${PINECONE_HOST_URL}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_HOST_URL: ${QDRANT_HOST_URL}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
